<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350"><rect width="800" height="350" fill="#111810"/><g font-family="system-ui,sans-serif" fill="#c8d4c2"><text x="45" y="36" font-size="18">XOR: почему одной границы недостаточно</text><path d="M110 275H400M110 275V65" stroke="#77806a" stroke-width="1.5"/><path d="M150 235L340 90M150 90L340 235" stroke="#697460" stroke-dasharray="5 5"/><circle cx="245" cy="162.5" r="5" fill="#ffb900"/><g fill="#ff7f91"><circle cx="150" cy="235" r="14"/><circle cx="340" cy="90" r="14"/></g><g fill="#5dd6c4"><circle cx="150" cy="90" r="14"/><circle cx="340" cy="235" r="14"/></g><g font-size="14"><text x="125" y="263">(0, 0)</text><text x="320" y="263">(1, 0)</text><text x="125" y="63">(0, 1)</text><text x="320" y="63">(1, 1)</text><text x="450" y="115" fill="#ff7f91">● Класс 0: одинаковые координаты</text><text x="450" y="150" fill="#5dd6c4">● Класс 1: разные координаты</text><text x="450" y="205">Середины обеих диагоналей совпали.</text><text x="450" y="235">Прямая не разделит эти два отрезка.</text><text x="110" y="315">Скрытая нелинейность позволяет построить новые признаки.</text></g></g></svg>
