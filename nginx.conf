server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Это учебник без сборщика: ES-модули должны обновляться как единый набор,
  # иначе браузер может совместить новый app.js со старым data.js.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }
}
